name: main-red-watch

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write
  checks: read

jobs:
  watch:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Track red main in an issue
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'CI on main is RED — auto-tracker';
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const findTracker = async () => {
              const q = `is:issue is:open in:title "CI on main is RED" repo:${owner}/${repo}`;
              const res = await github.rest.search.issuesAndPullRequests({ q });
              return res.data.items.find((i) => !i.pull_request) || null;
            };

            if (run.conclusion === 'success') {
              const tracker = await findTracker();
              if (!tracker) return;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: tracker.number,
                body: `Main is green again — CI run ${run.html_url} succeeded on \`${run.head_sha.slice(0, 7)}\`. Closing this tracker.`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: tracker.number,
                state: 'closed'
              });
              return;
            }

            let failing = ['- (per-check details unavailable — see the run log)'];
            try {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: run.head_sha,
                per_page: 100
              });
              const bad = checks.data.check_runs.filter(
                (c) => c.status === 'completed' && c.conclusion !== 'success' && c.conclusion !== 'skipped' && c.conclusion !== 'neutral'
              );
              if (bad.length) {
                failing = bad.map((c) => `- [${c.name}](${c.html_url}) — ${c.conclusion}`);
              }
            } catch (e) {}

            const who = run.triggering_actor?.login || 'unknown';
            const msg = (run.head_commit?.message || '').split('\n')[0];
            const body = [
              `CI on **main** failed: ${run.html_url}`,
              `Commit \`${run.head_sha.slice(0, 7)}\` pushed by @${who} — _${msg}_`,
              '',
              '**Failing checks:**',
              ...failing
            ].join('\n');

            const tracker = await findTracker();
            if (tracker) {
              await github.rest.issues.createComment({ owner, repo, issue_number: tracker.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body });
            }
